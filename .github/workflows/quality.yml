name: Quality checks

on:
  push:
    branches: [master, 'arena/**']
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          sed 's/^opencv-python/opencv-python-headless/' requirements.txt > /tmp/requirements-ci.txt
          python -m pip install -r /tmp/requirements-ci.txt
      - name: Compile Python modules
        run: python -m compileall -q src main.py tools tests
      - name: Run regression suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
